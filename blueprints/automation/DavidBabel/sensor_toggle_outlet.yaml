# 🧪 to test : update with led colors
# Appartement: Carmes
blueprint:
  name: "Miroir capteur de seuil -> Prise on/off"
  description: >
    Allume une prise quand un capteur binaire (ex. un seuil de puissance)
    passe à "on", et l'éteint quand il repasse à "off" après un délai
    (annulé si le capteur repasse à "on"). La prise est aussi remise en
    cohérence au démarrage de Home Assistant. Une lumière indique l'état :
    couleur "charge" quand la prise est allumée, couleur "décharge / idle"
    quand elle est éteinte.
  domain: automation
  input:
    threshold_sensor:
      name: Capteur de seuil
      description: Le capteur binaire (ex. le seuil créé pour ton Mac) à surveiller.
      default: binary_sensor.macbook_is_pushing
      selector:
        entity:
          domain: binary_sensor
    target_switch:
      name: Prise
      description: La prise on/off à piloter.
      default: switch.entree_prise_ventilateur_macbook_outlet
      selector:
        entity:
          domain: switch
    off_delay:
      name: Délai avant extinction
      description: >
        Temps d'attente (en secondes) après le passage à "off" avant
        d'éteindre la prise. Si le capteur repasse à "on" pendant ce délai,
        l'extinction est annulée.
      default: 60
      selector:
        number:
          min: 0
          max: 3600
          step: 5
          unit_of_measurement: s
          mode: box
    status_light:
      name: Lumière d'état
      description: La lumière associée aux évènements (ex. la LED de l'Atom Lite).
      default: light.salon_m5_atom_lite_atom_led
      selector:
        entity:
          domain: light
    charge_color:
      name: Couleur en charge
      description: Couleur de la lumière quand la prise est allumée (charge).
      default: [255, 140, 0]
      selector:
        color_rgb: {}
    idle_color:
      name: Couleur en décharge / idle
      description: Couleur de la lumière quand la prise est éteinte (décharge / idle).
      default: [0, 0, 255]
      selector:
        color_rgb: {}

trigger:
  - platform: state
    entity_id: !input threshold_sensor
    to: "on"
    id: "seuil_on"
  - platform: state
    entity_id: !input threshold_sensor
    to: "off"
    id: "seuil_off"
  - platform: state
    entity_id: !input threshold_sensor
    to: "unavailable"
    id: "signal_perdu"
  - platform: homeassistant
    event: start
    id: "ha_start"

condition: []

action:
  - variables:
      threshold_sensor: !input threshold_sensor
      seuil_etat: >-
        {{ states(threshold_sensor) }}
  - choose:
      - conditions:
          - condition: template
            value_template: >-
              {{ trigger.id == 'signal_perdu'
                 or (trigger.id == 'ha_start'
                     and seuil_etat in ['unavailable', 'unknown']) }}
        sequence:
          - repeat:
              count: 5
              sequence:
                - condition: template
                  value_template: "{{ states(threshold_sensor) in ['unavailable', 'unknown'] }}"
                - delay:
                    minutes: 1
          - action: switch.turn_off
            target:
              entity_id: !input target_switch
          - action: light.turn_on
            target:
              entity_id: !input status_light
            data:
              rgb_color: !input idle_color
      - conditions:
          - condition: trigger
            id: "seuil_on"
        sequence:
          - action: switch.turn_on
            target:
              entity_id: !input target_switch
          - action: light.turn_on
            target:
              entity_id: !input status_light
            data:
              rgb_color: !input charge_color
      - conditions:
          - condition: trigger
            id: "seuil_off"
        sequence:
          # État d'attente : un "on" pendant ce délai relance l'automation (mode: restart) et annule l'extinction
          - delay:
              seconds: !input off_delay
          - condition: template
            value_template: "{{ states(threshold_sensor) == 'off' }}"
          - action: switch.turn_off
            target:
              entity_id: !input target_switch
          - action: light.turn_on
            target:
              entity_id: !input status_light
            data:
              rgb_color: !input idle_color
      - conditions:
          - condition: trigger
            id: "ha_start"
        sequence:
          - if:
              - condition: template
                value_template: "{{ seuil_etat == 'on' }}"
            then:
              - action: switch.turn_on
                target:
                  entity_id: !input target_switch
              - action: light.turn_on
                target:
                  entity_id: !input status_light
                data:
                  rgb_color: !input charge_color
            else:
              - condition: template
                value_template: "{{ seuil_etat == 'off' }}"
              - action: switch.turn_off
                target:
                  entity_id: !input target_switch
              - action: light.turn_on
                target:
                  entity_id: !input status_light
                data:
                  rgb_color: !input idle_color

mode: restart
