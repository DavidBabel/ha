<!DOCTYPE html>
<html lang="fr">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Éditeur Schedule State - Home Assistant</title>
  <link rel="icon" type="image/x-icon" href="favicon.ico">
  <link rel="stylesheet" href="styles.css">
  <script src="https://cdn.jsdelivr.net/npm/js-yaml@4.1.0/dist/js-yaml.min.js"></script>
</head>

<body data-theme="dark">

  <!-- Floating Drag Info Tooltip -->
  <div id="drag-tooltip"></div>

  <!-- Header -->
  <header>
    <div class="brand">
      <span id="brand-icon"></span>
      <span>Schedule State Editor</span>
    </div>

    <!-- Day pills selector -->
    <div class="day-selector">
      <button class="day-btn active" data-day="mon">lun.</button>
      <button class="day-btn" data-day="tue">mar.</button>
      <button class="day-btn" data-day="wed">mer.</button>
      <button class="day-btn" data-day="thu">jeu.</button>
      <button class="day-btn" data-day="fri">ven.</button>
      <button class="day-btn" data-day="sat">sam.</button>
      <button class="day-btn" data-day="sun">dim.</button>
    </div>

    <!-- Action buttons -->
    <div class="header-actions">
      <select id="snap-select" class="snap-select" title="Précision magnétique du drag">
        <option value="5">Snap: 5 min</option>
        <option value="15" selected>Snap: 15 min</option>
        <option value="30">Snap: 30 min</option>
        <option value="60">Snap: 1 heure</option>
      </select>

      <button id="btn-toggle-split" class="btn" title="Basculer split Côte à côte / Haut-Bas">
        <span id="split-icon"></span>
        <span id="split-label">Côte à côte</span>
      </button>

      <button id="btn-add-room" class="btn btn-primary">
        <span id="add-room-icon"></span> Ajouter chambre
      </button>

      <button id="btn-copy-yaml" class="btn">
        <span id="copy-yaml-icon"></span> Copier YAML
      </button>

      <button id="btn-reset-demo" class="btn" title="Recharger la configuration d'exemple">
        <span id="reset-icon"></span> Exemple
      </button>

      <button id="btn-toggle-theme" class="btn icon-action-btn" title="Basculer thème clair/sombre">
        <span id="theme-icon"></span>
      </button>
    </div>
  </header>

  <!-- Container for Visual Editor + YAML Area (Vertical 70% / 30% par défaut) -->
  <div id="app-container" class="split-vertical">
    <!-- Visual Editor Pane (70% par défaut) -->
    <div id="visual-pane">
      <!-- Generated room cards will appear here -->
    </div>

    <!-- Draggable Splitter -->
    <div id="splitter" title="Glisser pour redimensionner"></div>

    <!-- YAML Code Editor Pane (30% par défaut) -->
    <div id="yaml-pane">
      <div class="yaml-toolbar">
        <div class="yaml-title">
          <span id="yaml-icon"></span>
          <span>Configuration YAML (schedule_state)</span>
        </div>
        <div id="yaml-status" class="yaml-status valid">
          <span id="status-icon"></span> Synchronisé
        </div>
      </div>
      <textarea id="yaml-textarea" spellcheck="false"
        placeholder="# Collez votre configuration schedule_state YAML ici..."></textarea>
    </div>
  </div>

  <!-- Modal for Period Edit / Manual Time Input -->
  <div id="period-modal" class="modal-overlay">
    <div class="modal-card">
      <div class="modal-header">
        <div class="modal-title" id="period-modal-title">Régler la période</div>
        <button class="modal-close-btn" onclick="closeModal('period-modal')">&times;</button>
      </div>

      <div class="form-group">
        <label>État souhaité</label>
        <div class="state-quick-btns">
          <button type="button" class="state-pill-btn" data-state="comfort">comfort</button>
          <button type="button" class="state-pill-btn" data-state="eco">eco</button>
          <button type="button" class="state-pill-btn" data-state="boost">boost</button>
          <button type="button" class="state-pill-btn" data-state="normal">normal</button>
          <button type="button" class="state-pill-btn" data-state="sleep">sleep</button>
          <button type="button" class="state-pill-btn" data-state="frost">frost</button>
          <button type="button" class="state-pill-btn" data-state="off">off</button>
        </div>
        <input type="text" id="modal-period-state" class="form-control" style="margin-top:6px"
          placeholder="Ou valeur libre (ex: 19 °C, 21 °C, auto)...">
      </div>

      <div class="form-row">
        <div class="form-group" style="flex:1">
          <label>Heure de début</label>
          <input type="time" id="modal-period-start" class="form-control" step="60" required>
        </div>
        <div class="form-group" style="flex:1">
          <label>Heure de fin</label>
          <input type="time" id="modal-period-end" class="form-control" step="60" required>
        </div>
      </div>

      <div class="form-group">
        <label>Appliquer aussi aux jours :</label>
        <div class="day-checkboxes">
          <label class="day-check-label"><input type="checkbox" id="chk-mon" value="mon"> Lun</label>
          <label class="day-check-label"><input type="checkbox" id="chk-tue" value="tue"> Mar</label>
          <label class="day-check-label"><input type="checkbox" id="chk-wed" value="wed"> Mer</label>
          <label class="day-check-label"><input type="checkbox" id="chk-thu" value="thu"> Jeu</label>
          <label class="day-check-label"><input type="checkbox" id="chk-fri" value="fri"> Ven</label>
          <label class="day-check-label"><input type="checkbox" id="chk-sat" value="sat"> Sam</label>
          <label class="day-check-label"><input type="checkbox" id="chk-sun" value="sun"> Dim</label>
        </div>
      </div>

      <div class="modal-actions">
        <button type="button" id="modal-period-delete-btn" class="btn" style="color:var(--danger)">
          <span id="modal-delete-icon"></span> Supprimer
        </button>
        <div style="display:flex; gap:8px">
          <button type="button" class="btn" onclick="closeModal('period-modal')">Annuler</button>
          <button type="button" id="modal-period-save-btn" class="btn btn-primary">Enregistrer</button>
        </div>
      </div>
    </div>
  </div>

  <!-- Modal for Room Edit / Icon picker -->
  <div id="room-modal" class="modal-overlay">
    <div class="modal-card">
      <div class="modal-header">
        <div class="modal-title" id="room-modal-title">Paramètres de la pièce</div>
        <button class="modal-close-btn" onclick="closeModal('room-modal')">&times;</button>
      </div>

      <div class="form-group">
        <label>Nom de la pièce / du capteur</label>
        <input type="text" id="modal-room-name" class="form-control" placeholder="ex: Chambre Mode">
      </div>

      <div class="form-group">
        <label>État par défaut (quand aucune période active)</label>
        <select id="modal-room-default" class="form-control">
          <option value="eco">eco</option>
          <option value="comfort">comfort</option>
          <option value="boost">boost</option>
          <option value="normal">normal</option>
          <option value="sleep">sleep</option>
          <option value="frost">frost</option>
          <option value="off">off</option>
        </select>
      </div>

      <div class="form-group">
        <label>Icône MDI</label>
        <div class="icon-grid" id="modal-icon-grid">
          <!-- Icons will be populated dynamically -->
        </div>
      </div>

      <div class="modal-actions" style="justify-content: flex-end;">
        <button type="button" class="btn" onclick="closeModal('room-modal')">Annuler</button>
        <button type="button" id="modal-room-save-btn" class="btn btn-primary">Enregistrer</button>
      </div>
    </div>
  </div>

  <!-- Toast notification -->
  <div id="toast">
    <span id="toast-icon"></span>
    <span id="toast-msg">Opération effectuée</span>
  </div>

      const path = MDI_SVG_PATHS[iconName] || MDI_SVG_PATHS['mdi:bed'];

    /* ==============================================================================
     * COULEURS & STYLES DES ÉTATS (Fidèle à Home Assistant schedule-state-card)
     * ============================================================================== */
    function getStateStyle(state) {
      const s = String(state).trim().toLowerCase();
      if (s === 'comfort') {
        return { bg: 'var(--state-comfort)', color: 'var(--state-comfort-text)' };
      }
      if (s === 'eco') {
        return {
          bg: `repeating-linear-gradient(45deg, #303f9f, #303f9f 8px, #3f51b5 8px, #3f51b5 16px)`,
          color: '#ffffff'
        };
      }
      if (s === 'boost') {
        return { bg: 'var(--state-boost)', color: 'var(--state-boost-text)' };
      }
      if (s === 'normal') {
        return {
          bg: `repeating-linear-gradient(45deg, #43a047, #43a047 8px, #4caf50 8px, #4caf50 16px)`,
          color: '#ffffff'
        };
      }
      if (s === 'sleep') {
        return { bg: 'var(--state-sleep)', color: 'var(--state-sleep-text)' };
      }
      if (s === 'frost') {
        return { bg: 'var(--state-frost)', color: 'var(--state-frost-text)' };
      }
      if (s === 'off') {
        return { bg: 'var(--state-off)', color: 'var(--state-off-text)' };
      }

      // Températures
      const num = parseFloat(s);
      if (!isNaN(num)) {
        if (num <= 17) return { bg: '#ff5722', color: '#ffffff' };
        if (num <= 19) return { bg: '#8e24aa', color: '#ffffff' };
        if (num <= 21) return { bg: '#e53935', color: '#ffffff' };
        if (num <= 23) return { bg: '#7cb342', color: '#ffffff' };
        return { bg: '#00acc1', color: '#ffffff' };
      }

      return { bg: '#0288d1', color: '#ffffff' };
    }

    /* ==============================================================================
     * CONVERSIONS TEMPORELLES
     * ============================================================================== */
    function timeToMinutes(str) {
      if (!str) return 0;
      const parts = str.split(':');
      const h = parseInt(parts[0], 10) || 0;
      const m = parseInt(parts[1], 10) || 0;
      return h * 60 + m;
    }

    function minutesToTime(mins) {
      mins = Math.max(0, Math.min(1439, Math.round(mins)));
      const h = Math.floor(mins / 60);
      const m = mins % 60;
      return `${String(h).padStart(2, '0')}:${String(m).padStart(2, '0')}`;
    }

    function formatTimeDisplay(mins) {
      if (mins >= 1439) return "23:59";
      return minutesToTime(mins);
    }

    function snap(mins) {
      return Math.round(mins / snapMinutes) * snapMinutes;
    }

    /* ==============================================================================
     * INTERACTIONS DE DRAG & DROP ET REDIMENSIONNEMENT SUR LES BLOCS
     * ============================================================================== */
    function initDragAndResize(block, roomId, evIndex, trackWrapper) {
      const handleLeft = block.querySelector('.resize-handle.left');
      const handleRight = block.querySelector('.resize-handle.right');
      const tooltip = document.getElementById('drag-tooltip');

      let mode = null;
      let startX = 0;
      let initialStart = 0;
      let initialEnd = 0;
      let hasMoved = false;

      function onMouseDown(e, actionType) {
        e.stopPropagation();
        mode = actionType;
        startX = e.clientX;
        hasMoved = false;

        const room = rooms.find(r => r.id === roomId);
        if (!room || !room.days[currentDay][evIndex]) return;

        initialStart = room.days[currentDay][evIndex].start;
        initialEnd = room.days[currentDay][evIndex].end;

        block.classList.add('dragging');

        tooltip.style.display = 'block';
        updateTooltip(e.clientX, e.clientY, initialStart, initialEnd);

        window.addEventListener('mousemove', onMouseMove);
        window.addEventListener('mouseup', onMouseUp);
      }

      function onMouseMove(e) {
        if (!mode) return;
        const deltaX = e.clientX - startX;
        if (Math.abs(deltaX) > 2) hasMoved = true;

        const trackRect = trackWrapper.getBoundingClientRect();
        const deltaMinutes = (deltaX / trackRect.width) * 1440;

        let newStart = initialStart;
        let newEnd = initialEnd;
        const duration = initialEnd - initialStart;

        if (mode === 'drag') {
          let shiftedStart = snap(initialStart + deltaMinutes);
          shiftedStart = Math.max(0, Math.min(1439 - duration, shiftedStart));
          newStart = shiftedStart;
          newEnd = shiftedStart + duration;
        } else if (mode === 'resize-left') {
          newStart = snap(initialStart + deltaMinutes);
          newStart = Math.max(0, Math.min(initialEnd - snapMinutes, newStart));
        } else if (mode === 'resize-right') {
          newEnd = snap(initialEnd + deltaMinutes);
          newEnd = Math.max(newStart + snapMinutes, Math.min(1439, newEnd));
        }

        const leftPct = (newStart / 1440) * 100;
        const widthPct = Math.max(1, ((newEnd - newStart) / 1440) * 100);
        block.style.left = `${leftPct}%`;
        block.style.width = `${widthPct}%`;

        const startBadge = block.querySelector('.block-time-badge.start');
        const endBadge = block.querySelector('.block-time-badge.end');
        if (startBadge) startBadge.textContent = minutesToTime(newStart);
        if (endBadge) endBadge.textContent = formatTimeDisplay(newEnd);

        updateTooltip(e.clientX, e.clientY, newStart, newEnd);

        const room = rooms.find(r => r.id === roomId);
        if (room && room.days[currentDay][evIndex]) {
          room.days[currentDay][evIndex].start = newStart;
          room.days[currentDay][evIndex].end = newEnd;
        }
      }

      function onMouseUp(e) {
        if (!mode) return;
        window.removeEventListener('mousemove', onMouseMove);
        window.removeEventListener('mouseup', onMouseUp);
        tooltip.style.display = 'none';
        block.classList.remove('dragging');

        if (hasMoved) {
          block.dataset.preventClick = 'true';
          const room = rooms.find(r => r.id === roomId);
          if (room) {
            room.days[currentDay].sort((a, b) => a.start - b.start);
          }
          syncYamlFromUI();
          renderApp();
        }

        mode = null;
      }

      function updateTooltip(x, y, startM, endM) {
        tooltip.style.left = `${x}px`;
        tooltip.style.top = `${y - 12}px`;
        const dur = endM - startM;
        const durH = Math.floor(dur / 60);
        const durM = dur % 60;
        const durStr = durH > 0 ? `${durH}h${durM > 0 ? String(durM).padStart(2, '0') : ''}` : `${durM}min`;
        tooltip.textContent = `${minutesToTime(startM)} → ${formatTimeDisplay(endM)} (${durStr})`;
      }

      block.addEventListener('mousedown', (e) => {
        if (e.target.classList.contains('resize-handle')) return;
        onMouseDown(e, 'drag');
      });

      handleLeft.addEventListener('mousedown', (e) => onMouseDown(e, 'resize-left'));
      handleRight.addEventListener('mousedown', (e) => onMouseDown(e, 'resize-right'));
    }

    /* ==============================================================================
     * MODALE D'ÉDITION PRÉCISE DE PÉRIODE (SAISIE MANUELLE)
     * ============================================================================== */
    function openPeriodModal(roomId, evIndex = null, defaultStart = 420, defaultEnd = 480) {
      activeModalContext = { roomId, evIndex };
      const room = rooms.find(r => r.id === roomId);
      if (!room) return;

      const modal = document.getElementById('period-modal');
      const title = document.getElementById('period-modal-title');
      const startInput = document.getElementById('modal-period-start');
      const endInput = document.getElementById('modal-period-end');
      const stateInput = document.getElementById('modal-period-state');
      const deleteBtn = document.getElementById('modal-period-delete-btn');

      let currentEvent = null;
      if (evIndex !== null && room.days[currentDay][evIndex]) {
        currentEvent = room.days[currentDay][evIndex];
        title.textContent = `Modifier la période - ${room.name} (${DAY_LABELS[currentDay]})`;
        startInput.value = minutesToTime(currentEvent.start);
        endInput.value = minutesToTime(currentEvent.end);
        stateInput.value = currentEvent.state;
        deleteBtn.style.display = 'inline-flex';
      } else {
        title.textContent = `Ajouter une période - ${room.name} (${DAY_LABELS[currentDay]})`;
        startInput.value = minutesToTime(defaultStart);
        endInput.value = minutesToTime(defaultEnd);
        stateInput.value = 'comfort';
        deleteBtn.style.display = 'none';
      }

      document.querySelectorAll('#period-modal .state-pill-btn').forEach(btn => {
        btn.classList.toggle('active', btn.dataset.state === stateInput.value);
        btn.onclick = () => {
          document.querySelectorAll('#period-modal .state-pill-btn').forEach(b => b.classList.remove('active'));
          btn.classList.add('active');
          stateInput.value = btn.dataset.state;
        };
      });

      DAYS.forEach(d => {
        const chk = document.getElementById(`chk-${d}`);
        if (chk) chk.checked = (d === currentDay);
      });

      modal.classList.add('active');
    }

    document.getElementById('modal-period-save-btn').onclick = () => {
      if (!activeModalContext) return;
      const { roomId, evIndex } = activeModalContext;
      const room = rooms.find(r => r.id === roomId);
      if (!room) return;

      const startVal = document.getElementById('modal-period-start').value;
      const endVal = document.getElementById('modal-period-end').value;
      const stateVal = document.getElementById('modal-period-state').value.trim() || 'comfort';

      const startMin = timeToMinutes(startVal);
      let endMin = timeToMinutes(endVal);
      if (endMin <= startMin) {
        if (endVal === "00:00" && startMin > 0) {
          endMin = 1439;
        } else {
          showToast("L'heure de fin doit être supérieure à l'heure de début.");
          return;
        }
      }

      const selectedDays = [];
      DAYS.forEach(d => {
        const chk = document.getElementById(`chk-${d}`);
        if (chk && chk.checked) selectedDays.push(d);
      });

      if (selectedDays.length === 0) selectedDays.push(currentDay);

      selectedDays.forEach(day => {
        if (!room.days[day]) room.days[day] = [];
        if (day === currentDay && evIndex !== null) {
          room.days[day][evIndex] = { start: startMin, end: endMin, state: stateVal };
        } else {
          room.days[day].push({ start: startMin, end: endMin, state: stateVal });
        }
        room.days[day].sort((a, b) => a.start - b.start);
      });

      closeModal('period-modal');
      renderApp();
      syncYamlFromUI();
      showToast("Période enregistrée avec succès.");
    };

    document.getElementById('modal-period-delete-btn').onclick = () => {
      if (!activeModalContext || activeModalContext.evIndex === null) return;
      const { roomId, evIndex } = activeModalContext;
      const room = rooms.find(r => r.id === roomId);
      if (room && room.days[currentDay]) {
        room.days[currentDay].splice(evIndex, 1);
        closeModal('period-modal');
        renderApp();
        syncYamlFromUI();
        showToast("Période supprimée.");
      }
    };

    /* ==============================================================================
     * MODALE DE CONFIGURATION DE LA PIÈCE & CHOIX D'ICÔNES
     * ============================================================================== */
    function openRoomSettings(roomId) {
      activeModalContext = { roomId };
      const room = rooms.find(r => r.id === roomId);
      if (!room) return;

      document.getElementById('modal-room-name').value = room.name;
      document.getElementById('modal-room-default').value = room.default_state || 'eco';

      const grid = document.getElementById('modal-icon-grid');
      grid.innerHTML = '';
      COMMON_ICONS.forEach(iconName => {
        const opt = document.createElement('div');
        opt.className = `icon-option ${room.icon === iconName ? 'active' : ''}`;
        opt.innerHTML = getHaSvg(iconName, 24);
        opt.onclick = () => {
          document.querySelectorAll('.icon-option').forEach(o => o.classList.remove('active'));
          opt.classList.add('active');
          room._tempIcon = iconName;
        };
        grid.appendChild(opt);
      });

      document.getElementById('room-modal').classList.add('active');
    }

    document.getElementById('modal-room-save-btn').onclick = () => {
      if (!activeModalContext) return;
      const room = rooms.find(r => r.id === activeModalContext.roomId);
      if (room) {
        room.name = document.getElementById('modal-room-name').value.trim() || 'Chambre Mode';
        room.default_state = document.getElementById('modal-room-default').value;
        if (room._tempIcon) room.icon = room._tempIcon;
        delete room._tempIcon;
      }
      closeModal('room-modal');
      renderApp();
      syncYamlFromUI();
      showToast("Paramètres mis à jour.");
    };

    function closeModal(id) {
      document.getElementById(id).classList.remove('active');
      activeModalContext = null;
    }

    /* ==============================================================================
     * BOUTONS MALINS & ACTIONS PIÈCES
     * ============================================================================== */
    function updateRoomName(roomId, newName) {
      const room = rooms.find(r => r.id === roomId);
      if (room) {
        room.name = newName.trim();
        syncYamlFromUI();
      }
    }

    function updateRoomDefaultState(roomId, newState) {
      const room = rooms.find(r => r.id === roomId);
      if (room) {
        room.default_state = newState;
        renderApp();
        syncYamlFromUI();
      }
    }

    function addNewRoom() {
      const newId = 'room_' + Date.now();
      rooms.push({
        id: newId,
        name: `Nouvelle Pièce ${rooms.length + 1} Mode`,
        icon: 'mdi:bed',
        default_state: 'eco',
        days: {
          mon: [{ start: 420, end: 1320, state: 'comfort' }],
          tue: [{ start: 420, end: 1320, state: 'comfort' }],
          wed: [{ start: 420, end: 1320, state: 'comfort' }],
          thu: [{ start: 420, end: 1320, state: 'comfort' }],
          fri: [{ start: 420, end: 1320, state: 'comfort' }],
          sat: [{ start: 540, end: 1320, state: 'comfort' }],
          sun: [{ start: 540, end: 1320, state: 'comfort' }]
        }
      });
      renderApp();
      syncYamlFromUI();
      showToast("Nouvelle pièce ajoutée.");
    }

    function duplicateRoom(roomId) {
      const room = rooms.find(r => r.id === roomId);
      if (!room) return;
      const cloned = JSON.parse(JSON.stringify(room));
      cloned.id = 'room_' + Date.now();
      cloned.name = `${room.name} (Copie)`;
      rooms.push(cloned);
      renderApp();
      syncYamlFromUI();
      showToast(`Pièce "${room.name}" dupliquée.`);
    }

    function deleteRoom(roomId) {
      if (!confirm("Voulez-vous vraiment supprimer cette pièce ?")) return;
      rooms = rooms.filter(r => r.id !== roomId);
      renderApp();
      syncYamlFromUI();
      showToast("Pièce supprimée.");
    }

    function copyDay(roomId) {
      const room = rooms.find(r => r.id === roomId);
      if (!room) return;
      const events = room.days[currentDay] || [];
      internalClipboard = JSON.parse(JSON.stringify(events));
      showToast(`Jour ${DAY_LABELS[currentDay]} copié (${events.length} période(s)).`);
    }

    function pasteDay(roomId) {
      if (!internalClipboard) {
        showToast("Aucun jour n'a été copié pour l'instant.");
        return;
      }
      const room = rooms.find(r => r.id === roomId);
      if (!room) return;
      room.days[currentDay] = JSON.parse(JSON.stringify(internalClipboard));
      renderApp();
      syncYamlFromUI();
      showToast(`Planning collé sur ${DAY_LABELS[currentDay]}.`);
    }

    function applyToWeekdays(roomId) {
      const room = rooms.find(r => r.id === roomId);
      if (!room) return;
      const sourceEvents = JSON.parse(JSON.stringify(room.days[currentDay] || []));
      ['mon', 'tue', 'wed', 'thu', 'fri'].forEach(d => {
        room.days[d] = JSON.parse(JSON.stringify(sourceEvents));
      });
      renderApp();
      syncYamlFromUI();
      showToast(`Planning de ${DAY_LABELS[currentDay]} appliqué du Lundi au Vendredi !`);
    }

    function applyToWeekend(roomId) {
      const room = rooms.find(r => r.id === roomId);
      if (!room) return;
      const sourceEvents = JSON.parse(JSON.stringify(room.days[currentDay] || []));
      ['sat', 'sun'].forEach(d => {
        room.days[d] = JSON.parse(JSON.stringify(sourceEvents));
      });
      renderApp();
      syncYamlFromUI();
      showToast(`Planning de ${DAY_LABELS[currentDay]} appliqué à Samedi et Dimanche !`);
    }

    function applyToFullWeek(roomId) {
      const room = rooms.find(r => r.id === roomId);
      if (!room) return;
      const sourceEvents = JSON.parse(JSON.stringify(room.days[currentDay] || []));
      DAYS.forEach(d => {
        room.days[d] = JSON.parse(JSON.stringify(sourceEvents));
      });
      renderApp();
      syncYamlFromUI();
      showToast(`Planning appliqué à TOUTE la semaine pour ${room.name} !`);
    }

    /* ==============================================================================
     * SYNCHRONISATION BIDIRECTIONNELLE : UI -> YAML
     * ============================================================================== */
    function syncYamlFromUI() {
      if (isUpdatingUIFromYaml) return;
      isUpdatingYamlFromUI = true;

      try {
        const yamlOutput = generateYamlFromRooms(rooms);
        const textarea = document.getElementById('yaml-textarea');
        textarea.value = yamlOutput;

        const status = document.getElementById('yaml-status');
        status.className = 'yaml-status valid';
        status.innerHTML = `${getHaSvg('mdi:check-circle', 16)} Synchronisé (${rooms.length} capteurs)`;
      } catch (err) {
        console.error("Erreur génération YAML:", err);
      } finally {
        isUpdatingYamlFromUI = false;
      }
    }

    function generateYamlFromRooms(roomList) {
      const yamlBlocks = [];

      roomList.forEach(room => {
        const eventMap = new Map();

        DAYS.forEach(day => {
          const evs = room.days[day] || [];
          evs.forEach(ev => {
            const startStr = minutesToTime(ev.start);
            const endStr = formatTimeDisplay(ev.end);
            const key = `${startStr}|${endStr}|${ev.state}`;

            if (!eventMap.has(key)) {
              eventMap.set(key, {
                start: startStr,
                end: endStr,
                state: ev.state,
                weekdays: []
              });
            }
            eventMap.get(key).weekdays.push(day);
          });
        });

        const eventsList = [];
        eventMap.forEach(item => {
          const evObj = {
            start: item.start,
            end: item.end,
            state: item.state
          };

          if (item.weekdays.length > 0) {
            evObj.condition = {
              condition: 'time',
              weekday: item.weekdays
            };
          }
          eventsList.push(evObj);
        });

        const roomConfig = {
          platform: 'schedule_state',
          name: room.name,
          icon: room.icon || 'mdi:bed',
          default_state: room.default_state || 'eco',
          events: eventsList
        };

        yamlBlocks.push(roomConfig);
      });

      if (window.jsyaml && window.jsyaml.dump) {
        return window.jsyaml.dump(yamlBlocks, {
          indent: 2,
          lineWidth: -1,
          noRefs: true
        });
      }

      return manualYamlDump(yamlBlocks);
    }

    function manualYamlDump(blocks) {
      let out = "";
      blocks.forEach(b => {
        out += `- platform: ${b.platform}\n`;
        out += `  name: "${b.name}"\n`;
        out += `  icon: ${b.icon}\n`;
        out += `  default_state: ${b.default_state}\n`;
        out += `  events:\n`;
        b.events.forEach(ev => {
          out += `    - start: "${ev.start}"\n`;
          out += `      end: "${ev.end}"\n`;
          out += `      state: ${ev.state}\n`;
          if (ev.condition && ev.condition.weekday) {
            out += `      condition:\n`;
            out += `        condition: time\n`;
            out += `        weekday: [${ev.condition.weekday.join(', ')}]\n`;
          }
        });
        out += `\n`;
      });
      return out;
    }

    /* ==============================================================================
     * SYNCHRONISATION BIDIRECTIONNELLE : YAML -> UI
     * ============================================================================== */
    function syncUIFromYaml(yamlText) {
      if (isUpdatingYamlFromUI) return;
      isUpdatingUIFromYaml = true;

      const status = document.getElementById('yaml-status');

      try {
        if (!yamlText || !yamlText.trim()) {
          status.className = 'yaml-status valid';
          status.innerHTML = `${getHaSvg('mdi:information', 16)} YAML vide`;
          isUpdatingUIFromYaml = false;
          return;
        }

        let parsed = null;
        if (window.jsyaml && window.jsyaml.load) {
          parsed = window.jsyaml.load(yamlText);
        }

        if (!Array.isArray(parsed)) {
          if (parsed && typeof parsed === 'object') {
            parsed = [parsed];
          } else {
            throw new Error("Le YAML doit être une liste d'entités (- platform: schedule_state)");
          }
        }

        const newRooms = [];

        parsed.forEach((item, index) => {
          if (!item || typeof item !== 'object') return;
          if (item.platform && item.platform !== 'schedule_state') return;

          const roomId = 'room_' + Date.now() + '_' + index;
          const roomName = item.name || `Capteur ${index + 1}`;
          const roomIcon = item.icon || 'mdi:bed';
          const defaultState = item.default_state || 'eco';

          const daysObj = {
            mon: [], tue: [], wed: [], thu: [], fri: [], sat: [], sun: []
          };

          if (Array.isArray(item.events)) {
            item.events.forEach(ev => {
              if (!ev || !ev.start || !ev.end) return;
              const startMin = timeToMinutes(ev.start);
              const endMin = timeToMinutes(ev.end);
              const state = ev.state !== undefined ? String(ev.state) : 'comfort';

              let targetDays = DAYS;
              if (ev.condition && ev.condition.weekday) {
                const w = ev.condition.weekday;
                if (Array.isArray(w)) {
                  targetDays = w.map(d => String(d).trim().toLowerCase());
                } else if (typeof w === 'string') {
                  targetDays = [w.trim().toLowerCase()];
                }
              }

              targetDays.forEach(day => {
                if (daysObj[day]) {
                  daysObj[day].push({ start: startMin, end: endMin, state: state });
                }
              });
            });
          }

          DAYS.forEach(day => {
            daysObj[day].sort((a, b) => a.start - b.start);
          });

          newRooms.push({
            id: roomId,
            name: roomName,
            icon: roomIcon,
            default_state: defaultState,
            days: daysObj
          });
        });

        rooms = newRooms;
        renderApp();

        status.className = 'yaml-status valid';
        status.innerHTML = `${getHaSvg('mdi:check-circle', 16)} Synchronisé (${rooms.length} capteurs)`;
      } catch (err) {
        status.className = 'yaml-status error';
        status.innerHTML = `${getHaSvg('mdi:information', 16)} Erreur YAML : ${escapeHtml(err.message)}`;
      } finally {
        isUpdatingUIFromYaml = false;
      }
    }

    /* ==============================================================================
     * GESTION DU SPLITTER (HORIZONTAL & VERTICAL)
     * ============================================================================== */
    function initSplitter() {
      const splitter = document.getElementById('splitter');
      const visualPane = document.getElementById('visual-pane');
      const yamlPane = document.getElementById('yaml-pane');
      const container = document.getElementById('app-container');

      let isDragging = false;

      splitter.addEventListener('mousedown', (e) => {
        isDragging = true;
        splitter.classList.add('dragging');
        document.body.style.cursor = splitMode === 'split-vertical' ? 'col-resize' : 'row-resize';
      });

      window.addEventListener('mousemove', (e) => {
        if (!isDragging) return;
        const rect = container.getBoundingClientRect();

        if (splitMode === 'split-vertical') {
          const relativeX = e.clientX - rect.left;
          const totalWidth = rect.width;
          const pct = Math.max(20, Math.min(80, (relativeX / totalWidth) * 100));
          visualPane.style.width = `${pct}%`;
          yamlPane.style.width = `${100 - pct}%`;
        } else {
          const relativeY = e.clientY - rect.top;
          const totalHeight = rect.height;
          const pct = Math.max(20, Math.min(80, (relativeY / totalHeight) * 100));
          visualPane.style.height = `${pct}%`;
          yamlPane.style.height = `${100 - pct}%`;
        }
      });

      window.addEventListener('mouseup', () => {
        if (isDragging) {
          isDragging = false;
          splitter.classList.remove('dragging');
          document.body.style.cursor = '';
        }
      });
    }

    function toggleSplitMode() {
      const container = document.getElementById('app-container');
      const visualPane = document.getElementById('visual-pane');
      const yamlPane = document.getElementById('yaml-pane');
      const iconSpan = document.getElementById('split-icon');
      const labelSpan = document.getElementById('split-label');

      // Réinitialiser les styles inline
      visualPane.style.width = '';
      visualPane.style.height = '';
      yamlPane.style.width = '';
      yamlPane.style.height = '';

      if (splitMode === 'split-vertical') {
        splitMode = 'split-horizontal';
        container.classList.remove('split-vertical');
        container.classList.add('split-horizontal');
        iconSpan.innerHTML = getHaSvg('mdi:view-split-horizontal', 18);
        labelSpan.textContent = 'Haut / Bas';
        showToast("Affichage basculé en Haut / Bas.");
      } else {
        splitMode = 'split-vertical';
        container.classList.remove('split-horizontal');
        container.classList.add('split-vertical');
        iconSpan.innerHTML = getHaSvg('mdi:view-split-vertical', 18);
        labelSpan.textContent = 'Côte à côte';
        showToast("Affichage basculé en Côte à côte (70% / 30%).");
      }
    }

    /* ==============================================================================
     * UTILITAIRES & NOTIFICATIONS
     * ============================================================================== */
    function showToast(msg) {
      const toast = document.getElementById('toast');
      const msgSpan = document.getElementById('toast-msg');
      msgSpan.textContent = msg;
      toast.classList.add('show');
      setTimeout(() => toast.classList.remove('show'), 2800);
    }

    function escapeHtml(str) {
      if (!str) return '';
      return String(str)
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;')
        .replace(/'/g, '&#39;');
    }

    /* ==============================================================================
     * INITIALISATION GLOBALE DE L'APPLICATION
     * ============================================================================== */
    window.addEventListener('DOMContentLoaded', () => {
      // 0. Injection des icônes SVG dans le header et modals
      document.getElementById('brand-icon').innerHTML = getHaSvg('mdi:calendar-clock', 24);
      document.getElementById('split-icon').innerHTML = getHaSvg('mdi:view-split-vertical', 18);
      document.getElementById('add-room-icon').innerHTML = getHaSvg('mdi:plus-box', 18);
      document.getElementById('copy-yaml-icon').innerHTML = getHaSvg('mdi:content-copy', 18);
      document.getElementById('reset-icon').innerHTML = getHaSvg('mdi:refresh', 18);
      document.getElementById('theme-icon').innerHTML = getHaSvg('mdi:theme-light-dark', 18);
      document.getElementById('yaml-icon').innerHTML = getHaSvg('mdi:code-braces', 18);
      document.getElementById('status-icon').innerHTML = getHaSvg('mdi:check-circle', 16);
      document.getElementById('modal-delete-icon').innerHTML = getHaSvg('mdi:trash-can-outline', 18);
      document.getElementById('toast-icon').innerHTML = getHaSvg('mdi:information', 20);

      // 1. Charger les données par défaut fournies
      rooms = getInitialRooms();

      // 2. Gestion des boutons des jours
      document.querySelectorAll('.day-btn').forEach(btn => {
        btn.addEventListener('click', () => {
          document.querySelectorAll('.day-btn').forEach(b => b.classList.remove('active'));
          btn.classList.add('active');
          currentDay = btn.dataset.day;
          renderApp();
        });
      });

      // 3. Snap select
      const snapSelect = document.getElementById('snap-select');
      snapSelect.addEventListener('change', () => {
        snapMinutes = parseInt(snapSelect.value, 10) || 15;
        showToast(`Magnétisme réglé sur ${snapMinutes} minutes.`);
      });

      // 4. Header buttons
      document.getElementById('btn-toggle-split').onclick = toggleSplitMode;
      document.getElementById('btn-add-room').onclick = addNewRoom;

      document.getElementById('btn-copy-yaml').onclick = () => {
        const textarea = document.getElementById('yaml-textarea');
        navigator.clipboard.writeText(textarea.value).then(() => {
          showToast("YAML copié dans le presse-papier !");
        }).catch(() => {
          textarea.select();
          document.execCommand('copy');
          showToast("YAML copié dans le presse-papier !");
        });
      };

      document.getElementById('btn-reset-demo').onclick = () => {
        if (confirm("Réinitialiser avec la configuration de démonstration ?")) {
          rooms = getInitialRooms();
          renderApp();
          syncYamlFromUI();
          showToast("Configuration d'exemple rechargée.");
        }
      };

      // 5. Thème clair / sombre
      document.getElementById('btn-toggle-theme').onclick = () => {
        const current = document.body.getAttribute('data-theme');
        const next = current === 'dark' ? 'light' : 'dark';
        document.body.setAttribute('data-theme', next);
        renderApp();
      };

      // 6. Textarea YAML -> Live UI sync avec debouncing
      let debounceTimeout = null;
      const textarea = document.getElementById('yaml-textarea');
      textarea.addEventListener('input', () => {
        clearTimeout(debounceTimeout);
        debounceTimeout = setTimeout(() => {
          syncUIFromYaml(textarea.value);
        }, 350);
      });

      // 7. Initialiser splitter & vue
      initSplitter();
      renderApp();
      syncYamlFromUI();
    });
  </script>
